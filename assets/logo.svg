<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="High Five">
  <!-- High-five handje: palm + 5 vingers, met H5 in de palm -->
  <g fill="none" stroke="#e8501e" stroke-width="9" stroke-linecap="round">
    <line x1="21" y1="41" x2="15.5" y2="28"/>  <!-- pink -->
    <line x1="27" y1="39" x2="24"   y2="17"/>  <!-- ringvinger -->
    <line x1="34" y1="38" x2="34"   y2="12"/>  <!-- middelvinger -->
    <line x1="41" y1="39" x2="43.5" y2="18"/>  <!-- wijsvinger -->
    <line x1="25" y1="48" x2="12"   y2="41"/>  <!-- duim -->
  </g>
  <ellipse cx="34" cy="46" rx="14" ry="12.5" fill="#e8501e"/>
  <text x="34" y="50.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
        font-size="13" font-weight="700" fill="#efe7f6">H5</text>
</svg>
